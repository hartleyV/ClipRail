<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ClipRail UI Preview</title><style>:root{--text:#2c2c2b;--muted:#77736d;--soft:#f9f8f7;--border:#e6e5e3;--blue:#2783de;--blue-soft:#edf7ff;--green:#46a171}*{box-sizing:border-box}body{margin:0;background:#ecebea;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;color:var(--text);display:grid;place-items:center;min-height:100vh}.panel{width:390px;height:760px;background:var(--soft);border:1px solid #d8d6d2;box-shadow:0 18px 60px rgba(44,44,43,.16);padding:14px;border-radius:14px;overflow:hidden}.top{height:44px;display:flex;align-items:center;gap:9px}.brand{font-size:20px;font-weight:720;letter-spacing:-.3px}.sub{color:var(--muted);font-size:13px}.actions{margin-left:auto;display:flex;gap:4px}.icon{width:38px;height:38px;border:0;background:transparent;border-radius:8px;font-size:17px;cursor:pointer}.icon:hover{background:#efeeec}.bar{background:white;border:1px solid var(--border);border-radius:9px;padding:7px 9px;display:flex;align-items:center;margin:8px 0 11px}.select{height:34px;border:0;background:transparent;color:var(--text);font-weight:600}.link{margin-left:auto;border:0;background:none;color:var(--blue);font-weight:600}.list{height:calc(100% - 107px);overflow:hidden}.card{background:white;border:1px solid var(--border);border-radius:11px;padding:12px;margin-bottom:10px;transition:.15s}.card:hover{border-color:#b9d4ee;transform:translateY(-1px)}.card.pinned{background:var(--blue-soft);border-color:var(--blue)}.meta{display:flex;align-items:center;gap:8px;height:24px}.check{appearance:none;width:18px;height:18px;margin:0;border:1.5px solid #aaa7a2;border-radius:5px;background:white}.check:checked{background:var(--blue);border-color:var(--blue)}.check:checked:after{content:'✓';display:block;color:white;text-align:center;font-weight:800;line-height:16px}.time{font-size:12.5px;color:var(--muted)}.pin{margin-left:auto;border:0;background:transparent;color:var(--blue);font-size:12.5px;font-weight:650;padding:5px 7px;border-radius:6px}.pin:hover{background:#dceefe}.content{font-size:15px;margin:9px 0 7px;line-height:1.55}.hint{color:var(--muted);font-size:12px}.copied{background:var(--green);color:white;border-radius:5px;padding:2px 7px;font-size:12px;font-weight:750}.image{height:145px;margin:9px 0 7px;border-radius:8px;background:linear-gradient(135deg,#d9e8f5,#f1dfcf 55%,#bcd5c8);position:relative;overflow:hidden}.image:after{content:'';position:absolute;inset:18px 24px;border:1px solid rgba(255,255,255,.65);border-radius:18px;background:linear-gradient(135deg,rgba(255,255,255,.35),rgba(255,255,255,.08))}.toast{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);background:#2c2c2b;color:white;padding:9px 13px;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.18);font-size:13px}</style></head><body><main class="panel"><header class="top"><span class="brand">ClipRail</span><span class="sub">本地剪贴板</span><div class="actions"><button class="icon" title="自动隐藏">◒</button><button class="icon" title="设置">⚙</button></div></header><section class="bar"><select class="select"><option>全部记录 (24)</option><option>今天 (12)</option></select><button class="link">全选</button></section><section class="list"><article class="card pinned"><div class="meta"><input class="check" type="checkbox"><span class="time" style="color:var(--blue);font-weight:650">已置顶</span><button class="pin">取消置顶</button></div><div class="content">项目交付前请完成跨平台构建，并检查 Windows 与 Linux 下的快捷键注册。</div><div class="hint">单击复制 · 拖动调整顺序</div></article><article class="card"><div class="meta"><input class="check" type="checkbox" checked><span class="copied">✓ 已复制</span><button class="pin">置顶</button></div><div class="content">https://github.com/example/cliprail</div><div class="hint">单击复制 · 拖动调整顺序</div></article><article class="card"><div class="meta"><input class="check" type="checkbox"><span class="time">08月02日&nbsp; 21:48</span><button class="pin">置顶</button></div><div class="image" role="img" aria-label="剪贴板图片预览"></div><div class="hint">单击复制 · 拖动调整顺序</div></article><article class="card"><div class="meta"><input class="check" type="checkbox"><span class="time">08月02日&nbsp; 20:31</span><button class="pin">置顶</button></div><div class="content">Alt + V 快速显示或隐藏 ClipRail。</div><div class="hint">单击复制 · 拖动调整顺序</div></article></section></main><script>document.querySelectorAll('.card').forEach(c=>c.addEventListener('click',e=>{if(e.target.matches('button,input'))return;let t=c.querySelector('.time');if(t){t.className='copied';t.textContent='✓ 已复制';setTimeout(()=>{t.className='time';t.textContent='刚刚'},1000)}}));</script></body></html>
