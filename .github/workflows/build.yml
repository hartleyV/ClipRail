name: Build ClipRail

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: ClipRail-Windows
            binary: target/release/cliprail.exe
          - os: ubuntu-22.04
            artifact: ClipRail-Linux
            binary: target/release/cliprail
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxcb1-dev libxkbcommon-dev libwayland-dev libgtk-3-dev
      - uses: Swatinem/rust-cache@v2
      - name: Build release
        run: cargo build --release
      - name: Stage portable package
        shell: bash
        run: |
          mkdir -p dist/data/images dist/data/archives
          cp "${{ matrix.binary }}" dist/
          cp README.md LICENSE dist/
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/
