[package]
name = "cliprail"
version = "1.0.0"
edition = "2021"
description = "ClipRail - 轻量剪贴板历史侧栏"

[dependencies]
eframe = { version = "0.28", default-features = false, features = [
    "glow",
    "default_fonts",
    "wayland",
    "x11",
] }
arboard = "3.4"
global-hotkey = "0.5"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
crossbeam-channel = "0.5"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
# 不使用 panic = "abort"：全局快捷键、剪贴板等系统调用在部分环境下可能 panic，
# 保留 unwind 才能被捕获并降级为提示，避免直接闪退。
strip = true
incremental = false
